[build-system]
requires = ["uv_build>=0.9.30"]
build-backend = "uv_build"

[project]
name = "pathwright"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Configuration and logging
    "pydantic-settings>=2.0.0",
    "structlog>=25.1.0",

    # Data validation
    "pydantic>=2.0.0",

    # MCP server support
    "fastmcp>=2.0.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
pathwright = "pathwright.entry_points.cli:main"
pathwright-mcp = "pathwright.entry_points.mcp_server:run"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.5",
    "ty>=0.0.11",
]

[tool.uv]
package = true